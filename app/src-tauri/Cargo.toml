[package]
name = "kosh"
version = "0.1.0"
description = "Capture loose knowledge and find the exact passage that matters"
edition = "2021"
rust-version = "1.97.0"

[lib]
name = "kosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test-support = ["tauri/test", "dep:tempfile"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
refinery = { version = "=0.9.2", features = ["rusqlite"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.11.3", features = [] }
tempfile = { version = "=3.23.0", optional = true }
thiserror = { version = "=2.0.19" }
uuid = { version = "=1.23.5", features = ["v7"] }
