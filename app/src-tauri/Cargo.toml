[package]
name = "kosh"
version = "0.1.0"
description = "Capture loose knowledge and find the exact passage that matters"
edition = "2021"
rust-version = "1.97.0"

[lib]
name = "kosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test-support = ["tauri/test", "dep:tempfile"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
refinery = { version = "=0.9.2", features = ["rusqlite"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled", "limits"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.3", features = [] }
tempfile = { version = "=3.23.0", optional = true }
thiserror = { version = "=2.0.19" }
unicode-normalization = "=0.1.25"
url = "=2.5.8"
uuid = { version = "=1.23.5", features = ["v7"] }
