[package]
name = "kosh"
version = "0.1.0"
description = "Capture loose knowledge and find the exact passage that matters"
edition = "2021"
rust-version = "1.97.0"
default-run = "kosh"
autobins = false

[lib]
name = "kosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kosh"
path = "src/main.rs"

[[test]]
name = "kosh-relevance"
path = "tests/kosh_relevance_cli.rs"
harness = false

[features]
test-support = ["tauri/test", "dep:tempfile"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log = { version = "=0.4.33", features = ["std"] }
refinery = { version = "=0.9.2", features = ["rusqlite"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
rusqlite = { version = "=0.39.0", features = ["blob", "bundled", "functions", "limits"] }
rusty-s3 = { version = "=0.10.1", default-features = false, features = ["rustcrypto", "xml"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlite-vec = "=0.1.9"
url = "=2.5.8"
tauri = { version = "=2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.2"
tempfile = { version = "=3.23.0", optional = true }
thiserror = { version = "=2.0.19" }
time = { version = "=0.3.54", features = ["formatting", "parsing"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.23.5", features = ["v7"] }
zeroize = "=1.9.0"
image = { version = "=0.25.10", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
webp = { version = "=0.3.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-vision = "=0.3.2"
objc2-web-kit = "=0.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
