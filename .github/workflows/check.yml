name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and secret hygiene
        run: scripts/check-repository.sh
      - name: Test merge gate
        run: scripts/loop/test-gate.sh
